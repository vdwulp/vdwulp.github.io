<script defer src="https://cloud.umami.is/script.js" data-website-id="b7b1bc4a-4212-4419-b97b-3cc79719e795"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const sponsor = document.createElement("iframe");

    sponsor.src = "https://github.com/sponsors/vdwulp/button";
    sponsor.title = "Sponsor vdwulp";
    sponsor.width = "114";
    sponsor.height = "32";
    sponsor.style.border = "0";
    sponsor.style.borderRadius = "6px";
    sponsor.style.display = "block";

    const container = document.createElement("div");
    container.className = "github-sponsor-button";
    container.appendChild(sponsor);

    document.body.appendChild(container);
  });
</script>
<style>
  .github-sponsor-button {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 1000;
  }
</style>
